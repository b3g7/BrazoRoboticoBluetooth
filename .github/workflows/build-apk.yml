name: Compilar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Eliminar restos de versiones anteriores
        run: |
          rm -rf app/src/main/java/com/brazo
          rm -f app/src/main/res/values/styles.xml
          echo "Archivos antiguos eliminados"

      - name: Preparar Gradle
        run: gradle wrapper --gradle-version 8.10.2

      - name: Compilar APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BrazoRoboticoBluetooth-APK
          path: app/build/outputs/apk/debug/app-debug.apk
